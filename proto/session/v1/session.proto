syntax = "proto3";

package session.v1;

option go_package = "github.com/zoobz-io/aegis/proto/session/v1";

// SessionService provides session lifecycle management.
// Implemented by janus, consumed by services needing session operations.
service SessionService {
  // CreateSession issues a session token for a user.
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);

  // ValidateSession checks if a session token is valid and returns user info.
  rpc ValidateSession(ValidateSessionRequest) returns (ValidateSessionResponse);

  // RevokeSession revokes a specific session by token.
  rpc RevokeSession(RevokeSessionRequest) returns (RevokeSessionResponse);

  // RevokeUserSessions revokes all sessions for a user.
  rpc RevokeUserSessions(RevokeUserSessionsRequest) returns (RevokeUserSessionsResponse);

  // ListUserSessions lists active sessions for a user.
  rpc ListUserSessions(ListUserSessionsRequest) returns (ListUserSessionsResponse);

  // SubscribeSessionEvents streams session lifecycle events.
  // Enables real-time cache invalidation without polling.
  rpc SubscribeSessionEvents(SubscribeSessionEventsRequest) returns (stream SessionEvent);
}

// CreateSessionRequest contains the information needed to create a session.
message CreateSessionRequest {
  string user_id = 1;
  string user_agent = 2;
  string ip_address = 3;
}

// CreateSessionResponse contains the issued session token.
message CreateSessionResponse {
  string token = 1;
  int64 expires_at = 2; // Unix timestamp
}

// ValidateSessionRequest contains the session token to validate.
message ValidateSessionRequest {
  string token = 1;
}

// ValidateSessionResponse contains validation result and user info if valid.
message ValidateSessionResponse {
  bool valid = 1;
  string user_id = 2;
  int64 expires_at = 3; // Unix timestamp, 0 if invalid
}

// RevokeSessionRequest identifies the session to revoke.
message RevokeSessionRequest {
  string token = 1;
}

// RevokeSessionResponse is empty on success; errors use gRPC status.
message RevokeSessionResponse {}

// RevokeUserSessionsRequest identifies the user whose sessions to revoke.
message RevokeUserSessionsRequest {
  string user_id = 1;
}

// RevokeUserSessionsResponse contains the count of revoked sessions.
message RevokeUserSessionsResponse {
  uint32 revoked_count = 1;
}

// ListUserSessionsRequest identifies the user whose sessions to list.
message ListUserSessionsRequest {
  string user_id = 1;
}

// ListUserSessionsResponse contains the user's active sessions.
message ListUserSessionsResponse {
  repeated SessionInfo sessions = 1;
}

// SessionInfo contains information about an active session.
message SessionInfo {
  string token_prefix = 1; // First N chars for identification, not full token
  int64 created_at = 2;    // Unix timestamp
  int64 expires_at = 3;    // Unix timestamp
  string user_agent = 4;
  string ip_address = 5;
}

// SubscribeSessionEventsRequest configures the event subscription.
message SubscribeSessionEventsRequest {}

// SessionEvent represents a session lifecycle event.
message SessionEvent {
  SessionEventType type = 1;
  string token_prefix = 2; // First N chars for identification, not full token
  string user_id = 3;
  int64 timestamp = 4;     // Unix timestamp
}

// SessionEventType identifies the kind of session lifecycle event.
enum SessionEventType {
  SESSION_EVENT_TYPE_UNSPECIFIED = 0;
  SESSION_EVENT_TYPE_CREATED = 1;
  SESSION_EVENT_TYPE_REVOKED = 2;
  SESSION_EVENT_TYPE_EXPIRED = 3;
}
